<style>
body{margin:0}

.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}

.inst{margin:6px 0 0;font-size:15px;line-height:1.5;color:#4F4A42;padding-left:14px;border-left:2px solid #2343B5;max-width:640px}

.cpt:not(.on){background:transparent}
.rule{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid rgba(21,21,21,.18)}
/* contrast panel */
.cpanel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.cgrp{display:flex;flex-direction:column;gap:18px;padding:28px;border-radius:20px;background:#FFFFFF;border:1px solid rgba(21,21,21,.15)}
.cg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sw{display:flex;flex-direction:column;gap:12px}

.swmeta{display:flex;flex-direction:column;gap:6px}
.ratio{font-family:'Darker Grotesque',sans-serif;font-weight:800;font-size:24px;line-height:1.1}
.ratio b{font-family:Roboto,system-ui,sans-serif;font-size:13px;font-weight:700;margin-left:6px}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}

@media (max-width: 760px){.ba{grid-template-columns:minmax(0,1fr)}.tall{height:520px !important}}
.ptag.own{background:#151515;color:#F9F7F2}

.chk{outline:2px dashed rgba(35,67,181,.55);outline-offset:4px}
.chip{display:inline-flex;padding:8px 14px;border-radius:999px;border:1px solid rgba(21,21,21,.3);font-size:14px;font-weight:500;background:#FFFFFF}

.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.fstep{flex:1 1 150px;display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:16px;background:#FFFFFF;border:1.5px solid rgba(21,21,21,.15)}
.fstep:first-child{background:#2343B5;border-color:#2343B5}

/* AI record */
.rec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid rgba(21,21,21,.15);border-radius:20px;overflow:hidden;background:#FFFFFF}
.rec > div{padding:22px 24px;display:flex;flex-direction:column;gap:10px;border-right:1px solid rgba(21,21,21,.12)}
.rec > div:last-child{border-right:none;background:#DCE2F4}
header a,.back{color:#151515}header a:hover,.back:hover{color:#2343B5}
@media (max-width: 640px){
.brand{font-size:30px !important}
.hdr{padding-top:12px !important;padding-bottom:10px !important;row-gap:6px !important}
.mainnav{flex-wrap:nowrap !important;gap:18px !important;font-size:15px !important;overflow-x:auto;max-width:100%;padding-bottom:2px;padding-right:24px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent)}
.mainnav a{white-space:nowrap}
}
/* Scroll reveal: a small rise and fade with a slow start and a long, soft landing. */
[data-rv]{opacity:0;transform:translateY(28px);transition:opacity 900ms cubic-bezier(.55,0,.1,1),transform 900ms cubic-bezier(.55,0,.1,1);transition-delay:var(--rd,0ms)}
[data-rv][data-in="1"]{opacity:1;transform:none}
.rv-off [data-rv]{opacity:1 !important;transform:none !important;transition:none !important}
.heroimg{filter:blur(12px);transform:scale(1.04);transition:filter 1100ms cubic-bezier(.55,0,.1,1),transform 1100ms cubic-bezier(.55,0,.1,1)}
.heroimg[data-in="1"],.rv-off .heroimg{filter:none;transform:none}
@media (prefers-reduced-motion: reduce){[data-rv],.heroimg{opacity:1 !important;transform:none !important;filter:none !important;transition:none !important}}
/* ---- interactions ---- */
.toc a{color:inherit;text-decoration:none;transition:color 200ms cubic-bezier(.22,1,.36,1)}
.toc a[data-on="1"]{color:#151515;font-weight:700}
.toc a[data-cur="1"]{color:#2343B5;font-weight:700}
.toc .fill{height:auto;bottom:4px;transform-origin:top;transform:scaleY(0);transition:transform 260ms cubic-bezier(.22,1,.36,1)}
.pin{transition:transform 200ms cubic-bezier(.22,1,.36,1),opacity 200ms cubic-bezier(.22,1,.36,1)}
.dec[data-hl] .pin{opacity:.35}
.dec[data-hl="1"] .pin[data-k="1"],.dec[data-hl="2"] .pin[data-k="2"],.dec[data-hl="3"] .pin[data-k="3"]{opacity:1;transform:scale(1.3)}
.why [data-k]{cursor:default;transition:border-color 200ms cubic-bezier(.22,1,.36,1)}
.why [data-k]:hover{border-color:#2343B5}
.cmp{position:relative;aspect-ratio:2158/1348;border-radius:12px;overflow:hidden;border:1.5px solid rgba(21,21,21,.15);background:#E6DECF;touch-action:pan-y;user-select:none;--x:50%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left top;pointer-events:none}
.cmp .aft{clip-path:inset(0 0 0 var(--x))}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#2343B5}
.cmp .knob{position:absolute;top:50%;left:var(--x);width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#2343B5;color:#F9F7F2;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 0 5px rgba(35,67,181,.2);transition:transform 160ms cubic-bezier(.22,1,.36,1)}
.cmp:active .knob{transform:scale(.92)}
.cmp .tg{position:absolute;top:14px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.cmp .tg.l{left:14px;background:rgba(21,21,21,.78);color:#F9F7F2}
.cmp .tg.r{right:14px;background:#2343B5;color:#F9F7F2}
.dot{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:opacity 160ms cubic-bezier(.22,1,.36,1)}
.dot i{display:block;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#151515;transition:transform 200ms cubic-bezier(.22,1,.36,1),background-color 160ms cubic-bezier(.22,1,.36,1)}
.dot[data-on="1"]{opacity:1}
.dot[data-hover="1"] i{transform:scale(3.4);background:rgba(21,21,21,.22)}
.dot[data-dark="1"] i{background:#F9F7F2}
.dot[data-dark="1"][data-hover="1"] i{background:rgba(249,247,242,.35)}
.dot[data-drag="1"] i{transform:scale(2.2);background:#2343B5}
.has-dot,.has-dot *{cursor:none !important}
/* ---- responsive ---- */
@media (max-width: 1100px){
.body{grid-template-columns:minmax(0,1fr) !important;gap:0 !important}
.side{display:none}
.hero{grid-template-columns:minmax(0,1fr) !important;gap:32px !important}
.g4,.meta{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
}
@media (max-width: 900px){
.g3,.why,.concepts,.rec{grid-template-columns:minmax(0,1fr) !important}
.rec > div{border-right:none !important;border-bottom:1.5px solid rgba(21,21,21,.15)}
.rec > div:last-child{border-bottom:none}
.g3 > .rule{display:grid;grid-template-columns:200px minmax(0,1fr);align-items:baseline;gap:16px}
}
@media (max-width: 760px){
.flow .fstep{flex:0 0 auto}
.g3 .rule{grid-template-columns:minmax(0,1fr);gap:6px}
.split,.g2,.g3,.why,.rec{grid-template-columns:minmax(0,1fr) !important}
.photos{grid-template-columns:repeat(2,minmax(0,1fr)) !important;grid-template-rows:180px 180px 180px !important}
.photos > div{grid-column:auto !important;grid-row:auto !important}
.photos > div:first-child{grid-row:span 2 !important}
.photos > div:last-child{grid-column:span 2 !important}
.rec > div{border-right:none !important;border-bottom:1.5px solid rgba(21,21,21,.15)}
.rec > div:last-child{border-bottom:none}
.dhead{grid-template-columns:minmax(0,1fr) !important;gap:8px !important}
.dhead .big{font-size:64px !important}
.sec{padding-top:96px !important;gap:28px !important}
.stat .n{font-size:46px !important}
.pin{width:24px;height:24px;margin:-12px 0 0 -12px;font-size:15px}
.vtag{font-size:11px;left:10px;bottom:10px;max-width:calc(100% - 20px)}
.nq{text-align:left !important}
.cmp .knob{width:38px;height:38px;margin:-19px 0 0 -19px}
}
@media (max-width: 420px){
.meta{grid-template-columns:minmax(0,1fr) !important}
.stat{padding:16px !important}.stat .n{font-size:40px !important}
}
@media (prefers-reduced-motion: reduce){.toc .fill,.pin,.cmp .knob{transition:none !important}}

/* Decision blocks: two zoom blocks + one trade-off line */
.dec{gap:48px}
.zooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.zf{margin:0;display:flex;flex-direction:column;background:#FFFFFF;border:1px solid rgba(21,21,21,.12);border-radius:20px;overflow:hidden}
.zimg{aspect-ratio:16/10;margin:14px 14px 0;border-radius:12px;overflow:hidden;border:1px solid rgba(21,21,21,.1);background:#FFFFFF}
.zimg img{display:block;width:100%;height:100%;object-fit:cover;object-position:left top}
.zc{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;align-items:start;padding:22px 24px 26px;font-family:'Darker Grotesque',sans-serif;font-weight:800;font-size:24px;line-height:1.15;color:#151515}
.zn{width:32px;height:32px;border-radius:50%;background:#2343B5;color:#F9F7F2;font-family:'Darker Grotesque',sans-serif;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center}
.tline{margin:8px 0 0;padding-top:18px;border-top:1px solid #2343B5;font-size:17px;line-height:1.65;max-width:640px}
.tline .cap{display:block;margin-bottom:6px;color:#2343B5}
.tline .x{color:#2343B5;font-weight:500}
.tline .z{color:#6E685E}
@media (max-width: 640px){.dec{gap:32px}.zooms{grid-template-columns:minmax(0,1fr);gap:16px}.zc{font-size:21px;padding:18px 18px 22px}}

/* Contrast badges land after their number has counted up */
.ratio b{display:inline-block;opacity:0;transform:scale(.6);transition:opacity 260ms cubic-bezier(.22,1,.36,1),transform 360ms cubic-bezier(.34,1.56,.64,1)}
.ratio [data-fin] + b,.rv-off .ratio b{opacity:1;transform:none}
/* Mobile header: name + Menu button; the links open as a full-screen sheet. */
.menubtn{display:none;appearance:none;border:1.5px solid #151515;background:transparent;color:#151515;border-radius:999px;padding:8px 16px;font:500 15px/1 Roboto,system-ui,sans-serif;cursor:pointer;min-height:40px}

.mnav[data-open="1"] .mnav-links a{opacity:1;transform:none}
.mnav-links a:active{color:#2343B5}
@media (max-width: 760px){
.mainnav{display:none !important}
.hdr > .menubtn{display:inline-flex;align-items:center}
.hdr{flex-wrap:nowrap !important}
}
/* Header A1: links in a see-through paper pill with a hairline edge; current section is a blue pill; one blue "Let's talk" button. */
.mainnav.pill{gap:2px !important;padding:5px;border-radius:999px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(21,21,21,.1);box-shadow:0 6px 20px rgba(21,21,21,.06);font-size:15px !important}

<!-- 01 PROBLEM -->
<section id="s0" data-s="0" class="sec">
<span class="cap b">01 / The problem</span>
<h2 class="d h2">A mission to inspire, buried under text.</h2>
<p class="p">Over the years NSTEM’s WordPress site had grown into long text pages, scattered menus and clashing colours. We interviewed <b>10 students</b> (I ran 3 of the interviews), audited the information architecture and looked at similar organisations.</p>
<div class="split" style="display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:start">
<figure style="margin:0;display:flex;flex-direction:column;gap:10px">
<div class="tall" tabindex="0" aria-label="Old internship page, scrollable" style="height:620px"><img src="/assets/da16b47c5f95b77ff195579cfd412305.webp" alt="An old NSTEM page: Internship details, one long wall of text"></div>
<figcaption class="cap">An old page: Internship details. Scroll inside.</figcaption>
</figure>
<div style="display:flex;flex-direction:column;gap:16px">
<span class="cap">What students told us</span>
<p class="hand" style="font-size:clamp(34px,3.4vw,48px);margin:0">Too complicated.</p>
<p class="hand" style="font-size:clamp(34px,3.4vw,48px);margin:0">Not sure what this site is for.</p>
<p class="hand" style="font-size:clamp(34px,3.4vw,48px);margin:0">Tiring to read.</p>
<p class="p" style="font-size:16px;margin-top:8px">Even the internal team got lost, and pages sat under unrelated categories.</p>
</div>
</div>
<div class="g3">
<div class="rule"><span class="d" style="font-size:30px">Keep the brand colours.</span><p class="li">The founder asked us not to drop any of them.</p></div>
<div class="rule"><span class="d" style="font-size:30px">Stay in WordPress.</span><p class="li">An older setup meant simple, repeatable layouts.</p></div>
<div class="rule"><span class="d" style="font-size:30px">Three designers.</span><p class="li">Everyone’s pages had to look like one site.</p></div>
</div>
<span class="cap" style="margin-top:-12px">Constraints we designed within</span>
</section>

<!-- 02 DECISIONS -->
<section id="s1" data-s="1" class="sec">
<span class="cap b">02 / Three decisions</span>
<h2 class="d h2">An accessible colour system first, then pages built on it</h2>
<p class="p">I led NSTEM’s first colour system and components, then designed the homepage, shop and join page with them.</p>

<div class="dec">
<div class="dhead"><span class="big">01</span><div style="display:flex;flex-direction:column;gap:18px"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="ptag">Accessible</span><span class="ptag own">Led by me</span></div><h3 class="d" style="font-size:clamp(30px,3vw,42px)">Brand colours that pass contrast</h3><p class="p" style="font-size:16px">Red was the main colour on every page, even for links, and white text on gold buttons failed WCAG.</p></div></div>
<div class="cpanel">
<div class="cgrp"><span class="cap">Before</span><div class="cg2"><div class="sw"><div class="swbox" style="background:#AF8F56;color:#FFFFFF"><span class="aa">Aa</span><span class="swb">Join now</span></div><div class="swmeta"><span class="li">White on gold buttons</span><span class="ratio"><span data-count="3.05" data-from="1" data-dec="2" data-suffix=":1">3.05:1</span> <b style="color:#B42318">✕ Fail</b></span></div></div><div class="sw"><div class="swbox" style="background:#000000;color:#C3241E"><span class="aa">Aa</span><span class="swb">Join now</span></div><div class="swmeta"><span class="li">Red text on black</span><span class="ratio"><span data-count="3.59" data-from="1" data-dec="2" data-suffix=":1">3.59:1</span> <b style="color:#B42318">✕ Fail</b></span></div></div></div></div>
<div class="cgrp"><span class="cap b">After</span><div class="cg2"><div class="sw"><div class="swbox" style="background:#0162A9;color:#FFFFFF"><span class="aa">Aa</span><span class="swb">Join now</span></div><div class="swmeta"><span class="li">White on Blue 700</span><span class="ratio"><span data-count="6.32" data-from="1" data-dec="2" data-suffix=":1">6.32:1</span> <b style="color:#1F7A3A">✓ Pass</b></span></div></div><div class="sw"><div class="swbox" style="background:#D1A833;color:#031C21"><span class="aa">Aa</span><span class="swb">Join now</span></div><div class="swmeta"><span class="li">Gray 900 on Yellow 700</span><span class="ratio"><span data-count="7.85" data-from="1" data-dec="2" data-suffix=":1">7.85:1</span> <b style="color:#1F7A3A">✓ Pass</b></span></div></div></div></div>
</div>
<span class="cap" style="margin-top:-28px">Measured on the old site and the new tokens. WCAG AA asks for at least 4.5:1.</span>
<figure style="margin:8px 0 0;display:flex;flex-direction:column;gap:10px">
<div class="media" style="aspect-ratio:2400/1387;background:#FFFFFF"><img src="/assets/443f84832977e820553220ac3c68b634.webp" alt="NSTEM design system: typography, colours, components and grid" style="object-fit:contain"></div>
<figcaption class="cap">NSTEM’s first design system: type, colour, components and grid.</figcaption>
</figure>
<div class="zooms">
<figure class="zf"><div class="zimg"><img src="/assets/0d94c4a98b36f146a26ec2c8f3337e04.webp" alt="Primary palette: blue, green, yellow and red, each in 700, 500 and 100" loading="lazy"></div><figcaption class="zc"><span class="zn">1</span>Each brand colour kept, refined into three shades.</figcaption></figure>
<figure class="zf"><div class="zimg"><img src="/assets/39e9b484b626e278a2a34cf609430b30.webp" alt="Button set in Blue 700 with outline and disabled states" loading="lazy"></div><figcaption class="zc"><span class="zn">2</span>Buttons lead in blue, so red no longer reads as a warning.</figcaption></figure>
</div>
<p class="tline"><span class="cap">Trade-off</span>The client wanted every brand colour kept, so instead of cutting any, <span class="x">each one got a rule for where it may appear</span>. Yellow only ever carries dark text: white on yellow fails at 2.24:1.</p>
</div>

<div class="dec">
<div class="dhead"><span class="big">02</span><div style="display:flex;flex-direction:column;gap:18px"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="ptag">Readable</span><span class="ptag own">My page</span></div><h3 class="d" style="font-size:clamp(30px,3vw,42px)">A homepage with one message per section</h3><p class="p" style="font-size:16px">The homepage read like a blog, so students couldn’t tell what NSTEM does.</p></div></div>
<div class="ba"><div style="display:flex;flex-direction:column;gap:10px"><span class="cap">Before</span><div class="tall" style="border-color:rgba(21,21,21,.15)" tabindex="0" aria-label="Before, scrollable"><img src="/assets/bdd9251735736c1ae929e6cb24a4e3e0.webp" alt="The old NSTEM homepage: black background, red labels, gold buttons"></div></div><div style="display:flex;flex-direction:column;gap:10px"><span class="cap b">After · scroll inside</span><div class="tall" style="border-color:#2343B5" data-play tabindex="0" aria-label="After · scroll inside, scrollable"><img src="/assets/af68d7a26039171d3a1ea3d9b1b381d5.webp" alt="The new NSTEM homepage: light sections, each with one message"></div></div></div>
<div class="zooms">
<figure class="zf"><div class="zimg"><img src="/assets/e1a7c7ce7eb4e07292895dceb34210d1.webp" alt="New first screen: what NSTEM is, with buttons for educators and students" loading="lazy"></div><figcaption class="zc"><span class="zn">1</span>The first screen says what NSTEM is, with two ways in.</figcaption></figure>
<figure class="zf"><div class="zimg"><img src="/assets/7f4702ee918b1d4e1ab6e6cae5e7429e.webp" alt="Why Join NSTEM section: one headline, short text and one link" loading="lazy"></div><figcaption class="zc"><span class="zn">2</span>Every section: one headline, short text, one action.</figcaption></figure>
</div>
<p class="tline"><span class="cap">Trade-off</span>WordPress couldn’t handle custom layouts, so every section uses <span class="x">one repeatable block</span>. <span class="z">Less variety</span>, but all three designers could build with it.</p>
</div>

<div class="dec">
<div class="dhead"><span class="big">03</span><div style="display:flex;flex-direction:column;gap:18px"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="ptag">Guided</span><span class="ptag own">My page</span></div><h3 class="d" style="font-size:clamp(30px,3vw,42px)">A join page that walks you through it</h3><p class="p" style="font-size:16px">Starting a chapter meant reading one long page of text and red links.</p></div></div>
<div class="ba"><div style="display:flex;flex-direction:column;gap:10px"><span class="cap">Before</span><div class="tall" style="border-color:rgba(21,21,21,.15)" tabindex="0" aria-label="Before, scrollable"><img src="/assets/7f9816b1bebf4dbb736079104463eb62.webp" alt="The old How to Start a Chapter page: long text, red links, gold buttons"></div></div><div style="display:flex;flex-direction:column;gap:10px"><span class="cap b">After · scroll inside</span><div class="tall" style="border-color:#2343B5" data-play tabindex="0" aria-label="After · scroll inside, scrollable"><img src="/assets/77c1dc522548d0175aafe247299d955a.webp" alt="The new Join as an Educator page: step-by-step guide, next steps and FAQ"></div></div></div>
<div class="zooms">
<figure class="zf"><div class="zimg"><img src="/assets/9918b0b371914d70dbbc98556eadc14f.webp" alt="Step-by-step guide: How do I start a chapter?" loading="lazy"></div><figcaption class="zc"><span class="zn">1</span>Starting a chapter, step by step, in order.</figcaption></figure>
<figure class="zf"><div class="zimg"><img src="/assets/bac6a6dc8afb6d3790ffa51b74ff2b59.webp" alt="FAQ accordion with the first question open" loading="lazy"></div><figcaption class="zc"><span class="zn">2</span>An FAQ answers the questions that come next.</figcaption></figure>
</div>
<p class="tline"><span class="cap">Trade-off</span>The page got longer than before, so <span class="x">each block answers exactly one question</span>. <span class="z">More scrolling</span>, but much less reading.</p>
</div>
</section>

<!-- 03 OUTCOME -->
<section id="s2" data-s="2" class="sec" style="padding-bottom:40px">
<span class="cap b">03 / Outcome</span>
<h2 class="d h2">Designed and handed over</h2>
<p class="p">The redesign is complete and handed over to NSTEM’s developers. The colour system and components give all three designers’ pages one look.</p>
<div class="cmp" data-cmp aria-label="Drag to compare the old and new NSTEM homepage">
<img src="/assets/595c499bd272dd9058b82f65088714d8.webp" alt="Old NSTEM homepage: black background, red labels and gold buttons">
<img class="aft" src="/assets/cdbb67e111e6e68d0e2459404515e259.webp" alt="New NSTEM homepage: light first screen that says what NSTEM is">
<span class="tg l">Before</span><span class="tg r">After</span>
<span class="bar"></span><span class="knob" aria-hidden="true">↔</span>
</div>
<div class="g3">
<div class="card"><span class="cap">What I learned</span><span class="d" style="font-size:28px">Talk to developers early</span><p class="li">Discussing WordPress limits with them made my designs buildable.</p></div>
<div class="card"><span class="cap">What I learned</span><span class="d" style="font-size:28px">Persuade with reasons</span><p class="li">Explaining each choice from the user’s side won stakeholders over, and the design system let me say yes to the client’s requests.</p></div>
<div class="card" style="background:#DCE2F4;border-color:#2343B5"><span class="cap" style="color:#16297A">What I’d change</span><span class="d" style="font-size:28px;color:#16297A">Next time</span><p class="li">I’d agree with the founder on how to measure sign-ups, so we can see the change after launch.</p></div>
</div>
</section>

links[j].dataset.cur = j === cur ? '1' : '0';
}

var y = 0;

y = (a.top - rail.top) + ((b.top - a.top) * prog);

if (el.dataset.in) delete el.dataset.in;

}, { threshold: 0 });
}
var probes = watched.concat(Array.prototype.slice.call(root.querySelectorAll('section, header, footer')));

if (this.io2) probes.forEach(function (el) { self.io2.observe(el); });

});
}
var hi = root.querySelectorAll('.heroimg');
this.timers.push(setTimeout(function () { hi.forEach(function (e) { e.dataset.in = '1'; }); self.reveal(); }, 120));

try { fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches; } catch (e) {}

}

for (var i = els.length - 1; i >= 0; i--) {
var el = els[i];
if (el.getBoundingClientRect().top < vh * 0.9) { el.dataset.in = '1'; els.splice(i, 1); }

}
// Wheel input eases toward its target (like Lenis). Keyboard, scrollbar and touch stay native.

var o = getComputedStyle(t).overflowY;
if ((o === 'auto' || o === 'scroll') && t.scrollHeight > t.clientHeight + 1) return; // inner scroller: leave it alone
t = t.parentElement;
}

var n = cur + (to - cur) * 0.1;

motionRoot() { return this.root; }
// What rises in: blocks inside each section; cards in a row follow each other.

Array.prototype.forEach.call(el.children, function (c) {
if (c.matches(DIG)) walk(c);
else if (c.matches(GRID)) Array.prototype.forEach.call(c.children, function (k, i) { k.setAttribute('data-rv', ''); k.style.setProperty('--rd', Math.min(i, 3) * 90 + 'ms'); });

root.querySelectorAll('.cs > section, .body section.sec').forEach(function (sec) { walk(sec); });
root.querySelectorAll('.hero > div:first-child > *').forEach(function (k, i) { k.style.setProperty('--rd', i * 90 + 'ms'); });

var el = this.root ? this.root.parentElement : null;
