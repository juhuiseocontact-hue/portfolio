/* How I build: scrolling sets data-step / data-on on #build; these rules do the motion. */

/* Section looks (option E): Selected work on brand blue with a blueprint grid and a wavy bottom edge;
   How I build on warm kraft paper. */
html,body{overflow-anchor:none}

background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:-1px -1px}

/* Experience: Education on the left, the year in the middle, Experience on the right.
   Each side has its own rail with a node per card; cards answer hover like the Pop button. */
.xp{display:flex;flex-direction:column;gap:14px}
.xp-heads,.xp-yr{display:grid;grid-template-columns:minmax(0,1fr) 136px minmax(0,1fr);align-items:center}
.xp-head{display:inline-flex;padding:6px 14px;border:1.5px solid rgba(21,21,21,.6);border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(21,21,21,.85)}
.xp-head-l{justify-self:end}
.xp-head-r{justify-self:start;border-color:var(--blue);color:var(--blue)}
.xp-list{position:relative;display:flex;flex-direction:column;gap:14px;padding:6px 0}
.xp-rail{position:absolute;top:0;bottom:0;width:1.5px;transform-origin:top;transform:scaleY(0);transition:transform 700ms cubic-bezier(.65,0,.35,1)}
.xp-rail-l{left:calc(50% - 56px);background:rgba(21,21,21,.3)}
.xp-rail-r{left:calc(50% + 56px);background:var(--blue)}
.xp-rail{transform:scaleY(var(--xp,0));transition:transform 160ms linear}
.xp-year,.xp-node{grid-column:2;grid-row:1}

<div style="aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: #ECECEC;"><img src="/assets/349b3e1276d9dd1dabdb4a84b8e39734.webp" alt="Just in Time on a phone: the day planned as one clock" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover;"></div>
