<!-- 01 PROBLEM -->
<section id="s0" data-s="0" class="sec">
<span class="cap b">01 / The problem</span>
<h2 class="d h2">Every feature was there. Clinics trusted paper instead.</h2>
<p class="p">Animana’s stock workflow had grown <b>more complex than the paper process it replaced</b>. I synthesised 300+ earlier research notes, then visited <b>5 clinics</b> for contextual inquiry and interviews.</p>
<div class="split" style="display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:28px;align-items:start">
<div class="photos" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:200px 200px;gap:10px">
<div class="media" style="grid-row:span 2"><img src="/assets/239e81409c6d3005727ed0a9c3c168df.webp" alt="Clinic storage room with shelves of medicine boxes"></div>
<div class="media" style="grid-column:span 2"><img src="/assets/cb02896f9f00cb9970b04db1d57772e8.webp" alt="Clinic staff member checking pharmacy shelves during a visit"></div>
<div class="media" style="grid-row:span 2"><img src="/assets/ddf5b849c67a0eb2030359089663c473.webp" alt="Taking notes by hand next to a delivery trolley"></div>
<div class="media" style="grid-column:span 2"><img src="/assets/7a89c6a8416cf4bf0ef7bf04a2199b45.webp" alt="Staff member showing a medicine cabinet"></div>
</div>
<div class="notes" style="padding-top:4px">
<div class="note"><span class="k">1</span><span>Staff <b>printed order lists and fixed them by hand</b>.</span></div>
<div class="note"><span class="k">2</span><span>Stock sat in <b>many places</b>: pharmacy, storage, even vets’ cars.</span></div>
<div class="note"><span class="k">3</span><span>Batch tracking worked for <b>one supplier only</b>.</span></div>
<div class="note"><span class="k">4</span><span>Orders passed between staff with <b>little visibility</b>.</span></div>
</div>
</div>
<figure style="margin:0;display:flex;flex-direction:column;gap:10px">
<div class="media" style="aspect-ratio:2400/788;background:#FFFFFF"><img src="/assets/90e1b27fb1ccc4fdc0164aef896d3977.webp" alt="Map of the current external ordering flow with user pain points on sticky notes" style="object-fit:contain"></div>
<figcaption class="cap">The old ordering flow, step by step. Pain points in yellow.</figcaption>
</figure>
<p class="hand" style="font-size:clamp(34px,3.8vw,54px);margin:8px 0 0;max-width:860px">It was all <span style="background:linear-gradient(transparent 62%, rgba(35,67,181,.18) 62%)">too scattered</span>, so people gave up halfway.</p>
<div class="g3">
<div class="rule"><span class="d" style="font-size:36px">Simple.</span><p class="li">Fewer steps. Nothing entered twice.</p></div>
<div class="rule"><span class="d" style="font-size:36px">Visible.</span><p class="li">Always see what was ordered, and where it is.</p></div>
<div class="rule"><span class="d" style="font-size:36px">In control.</span><p class="li">Mistakes are easy to undo and fix.</p></div>
</div>
<span class="cap" style="margin-top:-12px">Design principles, from 140 data notes and 27 prioritised insights</span>
</section>

<!-- 02 DECISIONS -->
<section id="s1" data-s="1" class="sec">
<span class="cap b">02 / Three decisions</span>
<h2 class="d h2">One place to start, one page to order, one step to book in</h2>
<p class="p">I scored three directions on impact and effort, then checked them with the Stock PM.</p>
<div class="g3 concepts">
<div class="card cpt on"><span class="ptag" style="background:#2343B5;color:#F9F7F2">Chosen</span><span class="d" style="font-size:26px">One entry point, with automation</span><span class="imp">High impact · High effort</span><p class="li">The biggest improvement across the workflow, and a long-term blueprint.</p></div>
<div class="card cpt"><span class="d" style="font-size:26px">Fewer steps in the current system</span><span class="imp">Medium-high impact · Low–medium effort</span><p class="li">Familiar and cheap, but it keeps the scattered structure.</p></div>
<div class="card cpt"><span class="d" style="font-size:26px">Accuracy first, through validation</span><span class="imp">High impact · Medium-high effort</span><p class="li">More reliable, but too many checks could overwhelm staff.</p></div>
</div>
<p class="p" style="font-size:16px;color:#4F4A42">I built on the first and kept one idea from the third: checks only at the moment they matter.</p>

<div class="dec">
<div class="dhead"><span class="big">01</span><div style="display:flex;flex-direction:column;gap:18px"><span class="ptag">Visible</span><h3 class="d" style="font-size:clamp(30px,3vw,42px)">A dashboard as the one place to start</h3><p class="p" style="font-size:16px">Stock information was spread across many pages.</p></div></div>
<div class="media vid" style="aspect-ratio:1920/906"><video data-auto="" muted="" loop="" playsinline="" preload="metadata" poster="/assets/a85ab389071c3f05d62be230e4964ce6.jpg" aria-label="Stock dashboard: filtering locations and checking stock alerts"><source src="/assets/625ecf69b5cc1791ca8cf9aa518f3a39.mp4" type="video/mp4"></video></div>
<div class="zooms">
<figure class="zf"><div class="zimg"><img src="/assets/0a138ecac429035dab57545797554f08.webp" alt="Location cards with out-of-stock, under-minimum and expired counts" loading="lazy"></div><figcaption class="zc"><span class="zn">1</span>Every location at a glance, colour-coded by status.</figcaption></figure>
<figure class="zf"><div class="zimg"><img src="/assets/ea6e2380f497bcc7c637438be257a884.webp" alt="Stock alerts tabs: out of stock, under minimum, expired, discrepancies" loading="lazy"></div><figcaption class="zc"><span class="zn">2</span>Alerts come first: out of stock, under minimum, expired.</figcaption></figure>
</div>
<p class="tline"><span class="cap">Trade-off</span>I designed only with Animana’s <span class="x">existing design system</span>, so it was quick to build and hand over. <span class="z">A few older patterns held usability back.</span></p>
</div>

<div class="dec">
<div class="dhead"><span class="big">02</span><div style="display:flex;flex-direction:column;gap:18px"><span class="ptag">Simple</span><h3 class="d" style="font-size:clamp(30px,3vw,42px)">One page for every order</h3><p class="p" style="font-size:16px">One order took seven-plus steps and hand-offs.</p></div></div>
<div class="media vid" style="aspect-ratio:1920/906"><video data-auto="" muted="" loop="" playsinline="" preload="metadata" poster="/assets/088e27412e6061e756099dc294d3e459.jpg" aria-label="New order page: adjusting suggested quantities and building the final order list"><source src="/assets/f807300096125cd4350d58d75829ea8e.mp4" type="video/mp4"></video></div>
<div class="zooms">
<figure class="zf"><div class="zimg"><img src="/assets/7ab98f7c708277b8944f7849f4e8bd3a.webp" alt="New order page with numbered tabs: suggested, internal, client, manual" loading="lazy"></div><figcaption class="zc"><span class="zn">1</span>Every order type on one page, in numbered sections.</figcaption></figure>
<figure class="zf"><div class="zimg"><img src="/assets/547f2cb5c7b54f5db5d3b9d028b7cf03.webp" alt="Suggested quantities next to stock and min/max levels" loading="lazy"></div><figcaption class="zc"><span class="zn">2</span>Suggested quantities, already filled in from min/max levels.</figcaption></figure>
</div>
<p class="tline"><span class="cap">Trade-off</span>Putting every order on one page made it long, so <span class="x">numbered steps with quick-jump links</span> keep it easy to move through.</p>
</div>

<div class="dec">
<div class="dhead"><span class="big">03</span><div style="display:flex;flex-direction:column;gap:18px"><span class="ptag">In control</span><h3 class="d" style="font-size:clamp(30px,3vw,42px)">Book in a delivery in one modal</h3><p class="p" style="font-size:16px">Partial deliveries and batch numbers were handled by hand.</p></div></div>
<div class="media vid" style="aspect-ratio:1920/906"><video data-auto="" muted="" loop="" playsinline="" preload="metadata" poster="/assets/dcce550cc5870737d9e089ad2fe6f3ae.jpg" aria-label="Book-in modal: splitting a partial delivery into arrived and delayed"><source src="/assets/d7a68cd461d15e4d4255a241ef09a9ee.mp4" type="video/mp4"></video></div>
<div class="zooms">
<figure class="zf"><div class="zimg"><img src="/assets/62cd90f465a9db827824fcb9914ec350.webp" alt="Batch number field inside the book-in row" loading="lazy"></div><figcaption class="zc"><span class="zn">1</span>Batch numbers go in right where the item is booked in.</figcaption></figure>
<figure class="zf"><div class="zimg"><img src="/assets/65a8259892a5b74dc5e0852fc421b47e.webp" alt="A line split into two arrived and two delayed" loading="lazy"></div><figcaption class="zc"><span class="zn">2</span>A partial delivery splits into arrived and delayed.</figcaption></figure>
</div>
<p class="tline"><span class="cap">Trade-off</span>One modal now holds a lot. To keep it manageable, <span class="x">batch fields only appear when an item needs them</span>.</p>
</div>
</section>

<!-- 03 BUILT -->
<section id="s2" data-s="2" class="sec">
<span class="cap b">03 / How I built it</span>
<h2 class="d h2">A prototype that behaves like the product</h2>
<p class="p">None of these screens existed in Animana yet. I designed them in Figma, then built a prototype where <b>every screen shares the same data</b>.</p>
<div class="flow">
<div class="fstep"><span class="cap b">You do</span><span class="ft">Place a new order</span></div>
<span class="farr" aria-hidden="true">→</span>
<div class="fstep"><span class="cap">Dashboard</span><span class="ft">Open orders <b>37 → 38</b></span></div>
<span class="farr" aria-hidden="true">→</span>
<div class="fstep"><span class="cap">Order pipeline</span><span class="ft">“Placed today” <b>+1</b></span></div>
<span class="farr" aria-hidden="true">→</span>
<div class="fstep"><span class="cap">Book in</span><span class="ft">Stock, back orders and alerts follow</span></div>
</div>
<div class="media vid" style="aspect-ratio:1920/906"><video data-auto="" muted="" loop="" playsinline="" preload="metadata" poster="/assets/c6be0921cea30e6ea2507acd3f8c917e.jpg" aria-label="Sending orders, then the order list and pipeline update with the new orders"><source src="/assets/fa131f42110693649a78f45e63e23057.mp4" type="video/mp4"></video></div>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
<span class="chip">Figma</span><span style="color:#2343B5">→</span><span class="chip">Claude Design</span><span style="color:#2343B5">→</span><span class="chip">Claude Code</span><span style="color:#2343B5">→</span><span class="chip">GitHub</span><span style="color:#2343B5">→</span><span class="chip" style="background:#2343B5;border-color:#2343B5;color:#F9F7F2">Vercel</span>
</div>
<div class="rec">
<div><span class="cap">New patterns, tried for real</span><p class="li">All three patterns were <b>new to Animana</b>. AI let me test them as working screens.</p></div>
<div><span class="cap">The whole flow, connected</span><p class="li">One shared data model, so the prototype follows the <b>real user flow</b> from order to stock.</p></div>
<div><span class="cap" style="color:#16297A">Tested fast</span><p class="li">A testable concept in <b>two weeks</b>. Testing showed where my rules didn’t match real stock.</p></div>
</div>
<p class="hand" style="font-size:34px;margin:0">AI built it fast. Checking it against how clinics really work made it right.</p>
</section>

<!-- 04 TEST -->
<section id="s3" data-s="3" class="sec">
<span class="cap b">04 / Test &amp; iterate</span>
<h2 class="d h2">From “nearly there” to ready to build</h2>
<p class="p"><b>5 internal stakeholders</b>, some with a veterinary background, created an order and booked it in. Their feedback became <b>23 insights</b>; I fixed the two biggest.</p>
<div class="g2">
<div class="card" style="border-color:#2343B5;box-shadow:6px 6px 0 #2343B5"><span class="cap b">✓ Worked</span><p class="li">Colour-coded status at a glance. The order list felt “like a shopping cart”.</p></div>
<div class="card" style="background:transparent"><span class="cap">Didn’t</span><p class="li">“Add to order” got lost on long lists. Back orders clashed with batch tracking.</p></div>
</div>
<div class="cmp" data-cmp="" aria-label="Drag to compare the book-in modal before and after iteration">
<img src="/assets/39e5f7e08f18dc3e3d7b19e753988d9a.webp" alt="Book-in modal before iteration">
<img class="aft" src="/assets/b28b13acde8d1b01e7c180b8c57997fc.webp" alt="Book-in modal after iteration">
<span class="tg l">Before</span><span class="tg r">After</span>
<span class="bar"></span><span class="knob" aria-hidden="true">↔</span>
</div>
</section>

<!-- 05 OUTCOME -->
<section id="s4" data-s="4" class="sec" style="padding-bottom:40px">
<span class="cap b">05 / Outcome</span>
<h2 class="d h2">Development-ready, and on the roadmap</h2>
<p class="p">I presented the redesign to the Animana department and handed over a development-ready version. It will be built step by step during the move to Angular, <span style="text-decoration:underline;text-decoration-color:#2343B5;text-decoration-thickness:1.5px;text-underline-offset:4px">starting with ordering</span>.</p>
<div class="g3">
<div class="card"><span class="cap">What I learned</span><span class="d" style="font-size:28px">Go to the shelf</span><p class="li">Watching clinics explained what 300+ notes couldn’t.</p></div>
<div class="card"><span class="cap">What I learned</span><span class="d" style="font-size:28px">Prototype the logic</span><p class="li">Real logic made testing realistic and showed what to improve.</p></div>
<div class="card" style="background:#DCE2F4;border-color:#2343B5"><span class="cap" style="color:#16297A">What I’d change</span><span class="d" style="font-size:28px;color:#16297A">Next time</span><p class="li">I’d test with clinic staff too, and propose design-system updates where existing patterns held usability back.</p></div>
</div>
</section>

}
reveal() {
var els = this.revealEls; if (!els || !els.length) return;

for (var i = els.length - 1; i >= 0; i--) {
var el = els[i];

}
// Wheel input eases toward its target (like Lenis). Keyboard, scrollbar and touch stay native.
wheelSmooth(e) {

// What rises in: blocks inside each section; cards in a row follow each other.

}
